# main에 푸시하면 Vercel(https://wyd2pmqna.vercel.app)에 자동 배포합니다.
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions):
#   - Secret   VERCEL_TOKEN      : Vercel 계정에서 만든 토큰 (https://vercel.com/account/tokens)
#   - Variable VERCEL_ORG_ID     : Vercel 팀 ID
#   - Variable VERCEL_PROJECT_ID : Vercel 프로젝트(wyd2pmqna) ID
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포가 멈춰도 오래 붙잡혀 있지 않도록 (보통 1분 안에 끝남)
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check settings
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN(secret), VERCEL_ORG_ID·VERCEL_PROJECT_ID(variables)를 저장소 설정에 넣어 주세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      # pnpm 버전은 package.json 의 packageManager 를 따릅니다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        # 갑작스러운 CLI 변경으로 배포가 깨지지 않게 버전을 고정합니다
        run: npm install --global vercel@64.2.0

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # vercel.json 의 buildCommand(서버 없는 정적 모드)로 빌드합니다
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
