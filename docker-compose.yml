# VPS: /opt/wyd2pm-qna 에서 `docker compose up -d --build`
# 이름(wyd2pm-qna)과 포트(18797)는 서버의 기존 서비스(wyd-backend 8090 등)와 겹치지 않게 정했습니다.
services:
  wyd2pm-qna:
    build: .
    container_name: wyd2pm-qna
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18797:3000"   # 외부에는 nginx(443)로만 엽니다
    volumes:
      - ./data:/data

  # 이 앱 전용 PostgreSQL. 서버의 다른 DB(MySQL 3306, PostgreSQL 5432·5433)와 따로 돌고,
  # 바깥 포트를 열지 않아 같은 컴포즈 안(호스트 이름 wyd2pm-qna-db)에서만 접속됩니다.
  wyd2pm-qna-db:
    image: postgres:16-alpine
    container_name: wyd2pm-qna-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wyd2pm_qna
      POSTGRES_USER: wyd2pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyd2pm -d wyd2pm_qna"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
