# /etc/nginx/sites-available/wyd-qna
# 설치: sudo ln -s /etc/nginx/sites-available/wyd-qna /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d qna.example.com
server {
    listen 80;
    server_name qna.example.com;   # ← 실제 도메인(또는 VPS IP)으로 바꾸세요

    client_max_body_size 64k;

    # 실시간 갱신(SSE)은 버퍼링 없이 오래 열어둡니다.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
