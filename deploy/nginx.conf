# /etc/nginx/sites-available/wyd2pm-qna
# 서버의 다른 사이트들과 같은 방식(sslip.io 서브도메인 + certbot)입니다.
# 설치 후: sudo certbot --nginx -d wyd2pm.31-97-71-87.sslip.io  (443·인증서 줄은 certbot이 추가)
server {
    listen 80;
    listen [::]:80;
    server_name wyd2pm.31-97-71-87.sslip.io;

    client_max_body_size 64k;

    # 실시간 갱신(SSE)은 버퍼링 없이 오래 열어둡니다.
    location /api/stream {
        proxy_pass http://127.0.0.1:18797;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
